<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="styles.css"/>
    <title>Layout Holy Grail</title>
    <style>
      .container {
        display: grid;
        grid-template-areas: "header header header" "navigation main ads" "footer footer footer";
        grid-template-columns: 150px 1fr 150px;
        grid-template-rows: 100px 1fr 30px;
        min-height: 100vh;
      }

      .hg__header {
        grid-area: header;
        background-color: brown;
      }

      .hg__footer {
        grid-area: footer;
        background-color: aquamarine;
      }

      .hg__main {
        grid-area: main;
        background-color: blueviolet;
      }

      .hg__left {
        grid-area: navigation;
        background-color: tomato;
      }

      .hg__right {
        grid-area: ads;
        background-color: steelblue;
      }

      @media screen and (max-width: 600px) {
        .container {
          grid-template-areas: "header" "navigation" "main" "ads" "footer";
          grid-template-columns: 100%;
          grid-template-rows: 100px 50px 1fr 50px 30px;
        }
      }
    </style>
  </head>

  <body class="container">
    <header class="hg__header"></header>

    <main class="hg__main"></main>

    <aside class="hg__left"></aside>

    <aside class="hg__right"></aside>

    <footer class="hg__footer"></footer>
  </body>
</html>
