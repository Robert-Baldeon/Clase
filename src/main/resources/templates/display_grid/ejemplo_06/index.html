<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .grid-container {
        display: grid;
        align-items: center;
        justify-items: center;
        justify-content: center;
        align-content: center;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(6, 1fr);
        gap: 2%;
      }

      .gallery {
        width: 90%;
        max-width: 800px;
        margin: 100px auto;
      }

      .gallery > img {
        width: 100%;
        height: 100%;
        border-radius: 10px;
        object-fit: cover;
        object-position: center;
      }

      .gallery > img:nth-child(1) {
        grid-row: 1 / 3;
        grid-column: 1 / 3;
      }

      .gallery > img:nth-child(2) {
        grid-row: 3 / 7;
        grid-column: 1 / 3;
      }

      .gallery > img:nth-child(3) {
        grid-column: 3 / 8;
        grid-row: 1 / 4;
      }

      .gallery > img:nth-child(4) {
        grid-row: 1 / 5;
      }

      .gallery > img:nth-child(5) {
        grid-row: 4 / 7;
        grid-column: 3 / 5;
      }

      .gallery > img:nth-child(6) {
        grid-row: 4 / 7;
        grid-column: 5 / 8;
      }
    </style>
  </head>

  <body>
    <div class="grid-container gallery">
      <img src="https://i.blogs.es/e239cb/crear-wallpapers-portada/1366_2000.jpeg"/>
      <img src="https://i.pinimg.com/736x/19/4c/80/194c808059fb53fd43622d932a3e5830.jpg"/>
      <img src="https://img.freepik.com/foto-gratis/pintura-lago-montana-montana-al-fondo_188544-9126.jpg?size=626&ext=jpg&ga=GA1.1.1016474677.1696824000&semt=ais"/>
      <img src="https://cdn.pixabay.com/photo/2026/01/29/18/52/parrot-10094674_1280.jpg"/>
      <img src="https://cdn.pixabay.com/photo/2023/06/17/19/39/temple-8070703_1280.jpg"/>
      <img src="https://i.blogs.es/d5130c/wallpaper-2.png/1366_2000.jpeg"/>
      <img src="https://www.tuexperto.com/wp-content/uploads/2022/01/paginas-descargar-fondos-de-pantalla.jpg"/>
      <img src="https://images.pexels.com/photos/1212487/pexels-photo-1212487.jpeg?auto=compress&cs=tinysrgb&dpr=1&w=500"/>
    </div>
  </body>
</html>
