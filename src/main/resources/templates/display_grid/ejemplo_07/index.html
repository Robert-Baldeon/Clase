<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .grid-container {
        display: grid;
        align-items: center;
        justify-content: center;
        text-align: center;
        justify-items: center;
        align-content: center;
      }

      .register-form {
        width: 80%;
        margin: 200px auto;
        max-width: 500px;
        border-radius: 10px;
        border: 3px solid black;
        padding: 20px;
        background-color: #98ffff;
        gap: 30px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        align-items: end;
      }

      .register-form > div {
        gap: 5px;
      }

      .register-form input,
      .register-form button {
        border-radius: 10px;
        border: 1px solid black;
        padding: 10px 10px;
      }

      .register-form button {
        cursor: pointer;
        width: 70%;
        background-color: rgba(255, 181, 156, 1);
      }
    </style>
  </head>

  <body>
    <form class="grid-container register-form">
      <div class="grid-container">
        <label>Nombre</label>
        <input type="text" />
      </div>

      <div class="grid-container">
        <label>Apellidos</label>
        <input type="text" />
      </div>

      <div class="grid-container">
        <label>Email</label>
        <input type="email" />
      </div>

      <div class="grid-container">
        <label>Contraseña</label>
        <input type="password" />
      </div>

      <div class="grid-container">
        <label>Repetir contraseña</label>
        <input type="password" />
      </div>

      <button>Enviar</button>
    </form>
  </body>
</html>
