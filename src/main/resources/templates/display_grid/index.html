<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link rel="stylesheet" href="style.css">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      ul {
        list-style: none;
      }

      a {
        text-decoration: none;
      }

      .grid-container {
        display: grid;
        text-align: center;
        justify-content: center;
        align-items: center;
        align-content: center;
        justify-items: center;
      }

      header > img {
        width: 100%;
        object-fit: contain;
      }

      header.grid-container {
        grid-template-columns: 100px 1fr;
        padding: 20px;
        gap: 50px;
        justify-items: end;
      }

      .menu {
        width: 30px;
        cursor: pointer;
        display: none;
      }

      header > nav {
        width: 100%;
      }

      .list {
        grid-template-columns: repeat(4, 1fr);
        width: 100%;
        font-size: 20px;
        gap: 20px;
      }

      @media (max-width: 700px) {
        .menu {
          display: block;
        }

        header > nav {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <header class="grid-container">
      <img src="https://framerusercontent.com/images/a0inY0Tv8XrYBmL4fRFhzvCfvgM.png">

      <nav>
        <ul class="list grid-container">
          <li>
            <a href="#">Home</a>
          </li>
          <li>
            <a href="#">About</a>
          </li>
          <li>
            <a href="#">Gallery</a>
          </li>
          <li>
            <a href="#">Contact</a>
          </li>
        </ul>
      </nav>
      <div class="menu">Esto es un menu</div>
    </header>
  </body>
</html>
